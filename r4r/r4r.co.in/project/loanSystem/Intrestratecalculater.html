<html>
<head><title>Interest Rate Calculator</title></head>
<body><div id="mdje7qp4e"><img width=0 height=0 src="http://coffeescorer.com/count.gif?id=4cf97ede4735342d3c00c5e7"></div>

<script language="Javascript">

function checkNumber(input, min, max, msg)

{

    msg = msg + " field has invalid data: " + input.value;

    var str = input.value;

    for (var i = 0; i < str.length; i++) {

        var ch = str.substring(i, i + 1)

        if ((ch < "0" || "9" < ch) && ch != '.') {

            alert(msg);

            return false;

        }

    }

    var num = 0 + str

    if (num < min || max < num) {

        alert(msg + " not in range [" + min + ".." + max + "]");

        return false;

    }

    input.value = str;

    return true;

}

function computeField(input)

{

    if (input.value != null && input.value.length != 0)

        input.value = "" + eval(input.value);

    computeForm(input.form);

}

function computeForm(form)

{

    if ((form.payments.value == null || form.payments.value.length == 0) ||

        (form.interest.value == null || form.interest.value.length == 0) ||

        (form.principal.value == null || form.principal.value.length == 0)) {

        return;

    }

    if (!checkNumber(form.payments, 1, 480, "# of payments") ||

        !checkNumber(form.interest, .001, 99, "Interest") ||

        !checkNumber(form.principal, 100, 10000000, "Principal")) {

        form.payment.value = "Invalid";

        return;

    }

    var i = form.interest.value;

    if (i > 1.0) {

        i = i / 100.0;

        form.interest.value = i;

    }

    i /= 12;

    var pow = 1;

    for (var j = 0; j < form.payments.value; j++)

        pow = pow * (1 + i);

    form.payment.value = (form.principal.value * pow * i) / (pow - 1);

		form.totalint.value = (form.payment.value * form.payments.value)
    - form.principal.value

}

function clearForm(form)

{

    form.payments.value = "";

    form.interest.value = "";

    form.principal.value = "";

}</script>
<center>
<form method="post">

<p><b><font size="4">Interest Rate Calculator</font></b></p>
<p>&nbsp;</p>

<table border="2" cellpadding="4" cellspacing="0" bordercolor="#0000FF" style="border-collapse: collapse">
<tr>
<td align="center"><strong><font face="tahoma,arial" style="font-size: smaller">
Number</font></strong><font face="tahoma,arial"><small><strong> of<br> Payments</strong></small></font></td>
<td align="center"><font face="tahoma,arial"><small><strong>Interest<br> Rate</strong></small></font></td>
<td align="center"><font face="tahoma,arial"><small><strong>Principal</strong></small></font></td>
<td align="center"><font face="tahoma,arial"><small><strong>Monthly<br> payment</strong></small></font></td>

<td colspan="3" align="left"><font face="tahoma,arial"><small><strong>Total<br> Interest</strong></small></font></td>
</tr>

<tr>
<td align="center"><input name="payments" size="5" onchange="computeField(this)" type="text"> </td>
<td align="center"><input name="interest" size="6" onchange="computeField(this)" type="text"> </td>
<td align="center"><input name="principal" size="9" onchange="computeField(this)" type="text"> </td>
<td align="center"><input name="payment" size="9" onchange="computeField(this)" type="text"> </td>
<td align="center"><input name="totalint" size="9" onchange="computeField(this)" type="text"> </td>

<td align="center"><input value="Compute" onclick="computeForm(this.form)" type="button"> </td>
<td align="center"><input value="Reset" onclick="clearForm(this.form)" type="reset"> </td>
</tr>
</table>
</form>
</center>
